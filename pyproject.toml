[project]
name = "paiec-laya"
version = "0.1.0"
description = "Offline Brier-ALC harness and Laya predictors for the PAIEC competition"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
