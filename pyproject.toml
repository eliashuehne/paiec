[project]
name = "paiec-laya"
version = "0.1.0"
description = "Offline Brier-ALC harness and Laya predictors for the PAIEC competition"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
laya = ["laya==0.4.13"]
eda = ["matplotlib>=3.9", "markdown-it-py>=3"]
tracking = ["mlflow==3.17.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
