[project]
name = "paiec"
version = "0.1.0"
description = "Offline Brier-ALC harness and predictors for the PAIEC competition"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
features = ["pydantic>=2.12,<3"]
dev = ["pytest>=8", "huggingface_hub>=0.30"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
